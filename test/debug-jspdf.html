<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debug jsPDF Loading</title>
</head>
<body>
    <h1>jsPDF Debug Test</h1>
    <p id="status">Loading jsPDF...</p>

    <script>
        console.log('Before loading jsPDF');
        console.log('typeof jsPDF:', typeof jsPDF);
        console.log('typeof window.jsPDF:', typeof window.jsPDF);
    </script>

    <script src="../js/jspdf.umd.min.js"></script>

    <script>
        console.log('After loading jsPDF');
        console.log('typeof jsPDF:', typeof jsPDF);
        console.log('typeof window.jsPDF:', typeof window.jsPDF);
        console.log('window object keys related to jsPDF:', Object.keys(window).filter(k => k.toLowerCase().includes('pdf')));
        console.log('window.jsPDF value:', window.jsPDF);

        // Try to see what jsPDF exports
        if (typeof window.jsPDF !== 'undefined') {
            console.log('window.jsPDF type:', typeof window.jsPDF);
            console.log('window.jsPDF keys:', Object.keys(window.jsPDF).slice(0, 20));
        }

        const status = document.getElementById('status');
        if (typeof jsPDF !== 'undefined') {
            status.innerHTML = '✅ jsPDF loaded as global';
            status.style.color = 'green';
        } else if (typeof window.jsPDF !== 'undefined') {
            status.innerHTML = '✅ jsPDF loaded as window.jsPDF';
            status.style.color = 'green';
        } else {
            status.innerHTML = '❌ jsPDF failed to load';
            status.style.color = 'red';
        }
    </script>
</body>
</html>
